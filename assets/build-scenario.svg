<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Технологический сценарий курса по сборке компьютера</title><desc id="desc">Сценарий содержит последовательность от подготовки через проверку совместимости и монтаж к первому запуску; при ошибке предусмотрен возврат к диагностике.</desc>
<defs><style>.bg{fill:#f7f9fb}.node{fill:#fff;stroke:#d4dee5;stroke-width:2}.good{fill:#e9f5ee;stroke:#287452;stroke-width:2}.decision{fill:#fff0e9;stroke:#c65b31;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#232c36}.head{font:700 21px Arial,sans-serif;fill:#232c36}.text{font:17px Arial,sans-serif;fill:#485563}.small{font:15px Arial,sans-serif;fill:#6f7c88}.line{stroke:#7f9f8b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.redline{stroke:#c65b31;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.edge{font:700 15px Arial,sans-serif;fill:#287452}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#7f9f8b"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#c65b31"/></marker></defs>
<rect class="bg" width="1200" height="980" rx="24"/><text x="60" y="62" class="title">Технологический сценарий курса</text><text x="60" y="92" class="small">Основной маршрут и возвраты при несовместимости или ошибке запуска</text>
<rect x="380" y="125" width="440" height="72" rx="12" class="good"/><text x="600" y="154" text-anchor="middle" class="head">Начало обучения</text><text x="600" y="178" text-anchor="middle" class="text">Цели и правила безопасности</text>
<path d="M600 197V236" class="line" marker-end="url(#arrow)"/><rect x="380" y="238" width="440" height="72" rx="12" class="node"/><text x="600" y="267" text-anchor="middle" class="head">Знакомство с компонентами</text><text x="600" y="291" text-anchor="middle" class="text">Назначение и разъёмы</text>
<path d="M600 310V349" class="line" marker-end="url(#arrow)"/><rect x="380" y="351" width="440" height="76" rx="12" class="node"/><text x="600" y="381" text-anchor="middle" class="head">Проверка совместимости</text><text x="600" y="405" text-anchor="middle" class="text">Сокет · память · размеры · питание</text>
<path d="M600 427V463" class="line" marker-end="url(#arrow)"/><path d="M600 465L720 520L600 575L480 520Z" class="decision"/><text x="600" y="516" text-anchor="middle" class="head">Всё подходит?</text><text x="600" y="540" text-anchor="middle" class="text">Проверены условия</text>
<path d="M720 520H930V375H825" class="redline" marker-end="url(#arrowRed)"/><text x="830" y="506" class="small" fill="#a74725">Нет — исправить выбор</text>
<path d="M600 575V618" class="line" marker-end="url(#arrow)"/><text x="618" y="601" class="edge">Да</text>
<rect x="380" y="620" width="440" height="76" rx="12" class="good"/><text x="600" y="650" text-anchor="middle" class="head">Подготовка и монтаж</text><text x="600" y="674" text-anchor="middle" class="text">CPU · RAM · SSD · плата · GPU · кабели</text>
<path d="M600 696V735" class="line" marker-end="url(#arrow)"/><rect x="380" y="737" width="440" height="72" rx="12" class="node"/><text x="600" y="766" text-anchor="middle" class="head">Первый запуск и POST</text><text x="600" y="790" text-anchor="middle" class="text">Инициализация основных устройств</text>
<path d="M600 809V847" class="line" marker-end="url(#arrow)"/><path d="M600 849L720 893L600 937L480 893Z" class="decision"/><text x="600" y="889" text-anchor="middle" class="head">Запуск успешен?</text><text x="600" y="912" text-anchor="middle" class="text">Есть изображение</text><path d="M720 893H1015V775H825" class="redline" marker-end="url(#arrowRed)"/><text x="842" y="879" class="small" fill="#a74725">Нет — диагностика</text><text x="60" y="952" class="small">После успешного запуска: проверка UEFI и итоговые задания.</text>
</svg>