<g><rect x="20" y="252" width="110" height="205" rx="9" class="card"/><text x="34" y="278" class="number">01</text><text x="34" y="308" class="head">Введение</text><text x="34" y="343" class="text">Цели</text><text x="34" y="367" class="text">Безопасность</text><text x="34" y="430" class="sub">3 урока</text></g>
<g><rect x="187" y="252" width="110" height="205" rx="9" class="card"/><text x="201" y="278" class="number">02</text><text x="201" y="308" class="head">Детали</text><text x="201" y="343" class="text">Плата</text><text x="201" y="367" class="text">CPU · RAM</text><text x="201" y="391" class="text">GPU · SSD</text><text x="201" y="430" class="sub">5 уроков</text></g>
<g><rect x="354" y="252" width="110" height="205" rx="9" class="card"/><text x="368" y="278" class="number">03</text><text x="368" y="308" class="head">Совмес-</text><text x="368" y="331" class="head">тимость</text><text x="368" y="367" class="text">Слоты</text><text x="368" y="391" class="text">Размеры</text><text x="368" y="430" class="sub">4 урока</text></g>
<g><rect x="521" y="252" width="110" height="205" rx="9" class="card"/><text x="535" y="278" class="number">04</text><text x="535" y="308" class="head">Подго-</text><text x="535" y="331" class="head">товка</text><text x="535" y="367" class="text">Инстру-</text><text x="535" y="391" class="text">менты</text><text x="535" y="430" class="sub">2 урока</text></g>
<g><rect x="688" y="252" width="110" height="205" rx="9" class="card"/><text x="702" y="278" class="number">05</text><text x="702" y="308" class="head">Сборка</text><text x="702" y="343" class="text">Монтаж</text><text x="702" y="367" class="text">Кабели</text><text x="702" y="430" class="sub">5 уроков</text></g>
<g><rect x="855" y="252" width="110" height="205" rx="9" class="card"/><text x="869" y="278" class="number">06</text><text x="869" y="308" class="head">Запуск</text><text x="869" y="343" class="text">POST</text><text x="869" y="367" class="text">UEFI</text><text x="869" y="430" class="sub">3 урока</text></g>
<g><rect x="1022" y="252" width="110" height="205" rx="9" class="accent"/><text x="1036" y="278" class="number">07</text><text x="1036" y="308" class="head">Проверка</text><text x="1036" y="343" class="text">Выбор</text><text x="1036" y="367" class="text">Соответ-</text><text x="1036" y="391" class="text">ствие</text><text x="1036" y="430" class="sub">4 урока</text></g>
<g><rect x="1189" y="252" width="110" height="205" rx="9" class="root"/><text x="1203" y="278" class="number">08</text><text x="1203" y="308" class="head">Мега-</text><text x="1203" y="331" class="head">босс</text><text x="1203" y="367" class="text">Выбор</text><text x="1203" y="391" class="text">Монтаж</text><text x="1203" y="415" class="text">Кабели</text><text x="1203" y="430" class="sub">1 урок</text></g>
<path d="M75 457V505H1245V457M660 505V536" class="line"/>
<rect x="235" y="536" width="850" height="126" rx="12" class="root"/>
<text x="660" y="575" text-anchor="middle" class="head">Итоговый результат</text>
<text x="660" y="607" text-anchor="middle" class="text">Проверка знаний + интерактивная сборка совместимого компьютера</text>
<text x="660" y="635" text-anchor="middle" class="sub">Подбор компонентов · монтаж · кабели · финальный осмотр</text>
<text x="55" y="760" class="sub">Схема показывает структуру курса, а не длительность занятий.</text>
</svg>