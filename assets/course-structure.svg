<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Структура учебного курса по сборке компьютера</title><desc id="desc">Семь разделов: введение, комплектующие, совместимость, подготовка, сборка, первый запуск, проверка знаний.</desc>
<defs><style>.bg{fill:#f7f9fb}.card{fill:#fff;stroke:#d6dfe5;stroke-width:2}.root{fill:#e9f5ee;stroke:#287452;stroke-width:2.5}.accent{fill:#fff0e9;stroke:#c65b31;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#232c36}.head{font:700 22px Arial,sans-serif;fill:#232c36}.text{font:17px Arial,sans-serif;fill:#4b5864}.number{font:700 17px Arial,sans-serif;fill:#287452}.line{stroke:#9cb7a5;stroke-width:3;fill:none;stroke-linecap:round}.sub{font:15px Arial,sans-serif;fill:#6f7c88}</style></defs>
<rect class="bg" width="1200" height="780" rx="24"/><text x="60" y="64" class="title">Иерархическая структура курса</text><text x="60" y="95" class="sub">Сборка персонального компьютера · 7 разделов · 26 учебных экранов</text>
<rect x="345" y="125" width="510" height="78" rx="12" class="root"/><text x="600" y="158" text-anchor="middle" class="head">Электронный учебный курс</text><text x="600" y="183" text-anchor="middle" class="text">Сборка персонального компьютера</text>
<path d="M600 203V232M95 232H1105M95 232V258M263 232V258M431 232V258M599 232V258M767 232V258M935 232V258M1105 232V258" class="line"/>
<g><rect x="25" y="258" width="140" height="205" rx="10" class="card"/><text x="44" y="287" class="number">01</text><text x="44" y="319" class="head">Введение</text><text x="44" y="350" class="text">Цели</text><text x="44" y="375" class="text">Безопасность</text><text x="44" y="433" class="sub">3 урока</text></g>
<g><rect x="193" y="258" width="140" height="205" rx="10" class="card"/><text x="212" y="287" class="number">02</text><text x="212" y="319" class="head">Детали</text><text x="212" y="350" class="text">Плата</text><text x="212" y="375" class="text">CPU · RAM</text><text x="212" y="400" class="text">GPU · SSD</text><text x="212" y="433" class="sub">5 уроков</text></g>
<g><rect x="361" y="258" width="140" height="205" rx="10" class="accent"/><text x="380" y="287" class="number">03</text><text x="380" y="319" class="head">Совмес-</text><text x="380" y="344" class="head">тимость</text><text x="380" y="375" class="text">Сокет</text><text x="380" y="400" class="text">Размеры</text><text x="380" y="433" class="sub">4 урока</text></g>
<g><rect x="529" y="258" width="140" height="205" rx="10" class="card"/><text x="548" y="287" class="number">04</text><text x="548" y="319" class="head">Подго-</text><text x="548" y="344" class="head">товка</text><text x="548" y="375" class="text">Инстру-</text><text x="548" y="400" class="text">менты</text><text x="548" y="433" class="sub">2 урока</text></g>
<g><rect x="697" y="258" width="140" height="205" rx="10" class="card"/><text x="716" y="287" class="number">05</text><text x="716" y="319" class="head">Сборка</text><text x="716" y="350" class="text">Установка</text><text x="716" y="375" class="text">Кабели</text><text x="716" y="433" class="sub">5 уроков</text></g>
<g><rect x="865" y="258" width="140" height="205" rx="10" class="card"/><text x="884" y="287" class="number">06</text><text x="884" y="319" class="head">Запуск</text><text x="884" y="350" class="text">POST</text><text x="884" y="375" class="text">UEFI</text><text x="884" y="433" class="sub">3 урока</text></g>
<g><rect x="1033" y="258" width="142" height="205" rx="10" class="root"/><text x="1052" y="287" class="number">07</text><text x="1052" y="319" class="head">Проверка</text><text x="1052" y="350" class="text">Выбор</text><text x="1052" y="375" class="text">Сопостав-</text><text x="1052" y="400" class="text">ление</text><text x="1052" y="433" class="sub">4 урока</text></g>
<path d="M95 463V510H1105V463M600 510V540" class="line"/><rect x="225" y="540" width="750" height="110" rx="12" class="root"/><text x="600" y="578" text-anchor="middle" class="head">Итоговый результат</text><text x="600" y="608" text-anchor="middle" class="text">Знания о компонентах · совместимость · сборка · проверка запуска</text><text x="600" y="633" text-anchor="middle" class="sub">Контрольные задания следуют после изучения материала</text>
</svg>