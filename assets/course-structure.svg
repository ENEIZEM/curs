<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
<title id="title">Структура учебного курса по сборке компьютера</title>
<desc id="desc">Восемь разделов и 27 экранов курса, включая финальную интерактивную сборку персонального компьютера.</desc>
<defs><style>
.bg{fill:#f7f9fb}.card{fill:#fff;stroke:#d6dfe5;stroke-width:2}.root{fill:#e9f5ee;stroke:#287452;stroke-width:2.5}.accent{fill:#fff0e9;stroke:#c65b31;stroke-width:2}
.title{font:700 30px Arial,sans-serif;fill:#232c36}.head{font:700 18px Arial,sans-serif;fill:#232c36}.text{font:15px Arial,sans-serif;fill:#4b5864}.number{font:700 16px Arial,sans-serif;fill:#287452}.line{stroke:#9cb7a5;stroke-width:3;fill:none;stroke-linecap:round}.sub{font:13px Arial,sans-serif;fill:#6f7c88}
</style></defs>
<rect class="bg" width="1320" height="820" rx="24"/>
<text x="55" y="58" class="title">Структура учебного курса</text>
<text x="55" y="87" class="sub">Сборка персонального компьютера · 8 разделов · 27 учебных экранов</text>
<rect x="390" y="112" width="540" height="72" rx="12" class="root"/>
<text x="660" y="143" text-anchor="middle" class="head">Электронный учебный курс</text>
<text x="660" y="166" text-anchor="middle" class="text">От изучения компонентов к самостоятельной сборке</text>
